<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="smallStarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4F46E5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Rounded Rectangle -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />
  
  <!-- Radial Glow Overlay -->
  <circle cx="64" cy="64" r="50" fill="url(#glowGrad)" />

  <!-- Outer Orbit -->
  <circle cx="64" cy="64" r="34" fill="none" stroke="url(#orbitGrad)" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="4 3" />

  <!-- Main AI Sparkle Star Core with Drop Shadow -->
  <path d="M64 36 C64 51.6 51.6 64 36 64 C51.6 64 64 76.4 64 92 C64 76.4 76.4 64 92 64 C76.4 64 64 51.6 64 36 Z" fill="url(#starGrad)" filter="url(#shadow)" />

  <!-- Core Center Highlight -->
  <path d="M64 50 C64 57.7 57.7 64 50 64 C57.7 64 64 70.3 64 78 C64 70.3 70.3 64 78 64 C70.3 64 64 57.7 64 50 Z" fill="#FFFFFF" fill-opacity="0.9" />

  <!-- Secondary Sparkle Top-Right -->
  <path d="M88 38 C88 43.3 82.7 48.6 77.4 48.6 C82.7 48.6 88 53.9 88 59.2 C88 53.9 93.3 48.6 98.6 48.6 C93.3 48.6 88 43.3 88 38 Z" fill="url(#smallStarGrad)" />

  <!-- Mini Sparkle Bottom-Left -->
  <path d="M42 78 C42 81.5 38.5 85 35 85 C38.5 85 42 88.5 42 92 C42 88.5 45.5 85 49 85 C45.5 85 42 81.5 42 78 Z" fill="#38BDF8" fill-opacity="0.85" />
</svg>
