# 名字会显示在 GitHub 仓库的 Actions 标签页左侧列表里。
name: Android CI

# ─────────────────────────────────────────────────────────────
# on: 什么时候触发这个 workflow（这就是"自动构建"的入口）
# ─────────────────────────────────────────────────────────────
on:
  # 推送到 main 时跑
  push:
    branches: [ main ]
  # 有人对 main 开 Pull Request 时也跑（PR 页面底部会显示检查结果）
  pull_request:
    branches: [ main ]
  # 允许在 Actions 页面手动点 "Run workflow" 触发，调试时很方便
  workflow_dispatch:

# ─────────────────────────────────────────────────────────────
# 权限：这个 workflow 只需要"读代码"，不需要写任何东西。
# 显式写出来是最小权限原则（默认令牌权限可能更大）。
# ─────────────────────────────────────────────────────────────
permissions:
  contents: read

# ─────────────────────────────────────────────────────────────
# 并发控制：同一个分支上又推了新代码时，取消上一次还没跑完的运行。
# 省时间，也避免"旧的运行结果覆盖新的"。
# ─────────────────────────────────────────────────────────────
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────
  # 只有一个 job：所有步骤串行跑在同一台机器上。
  # 测试步骤在前，构建步骤在后 —— 测试失败时后面的步骤根本不会执行，
  # 所以"测试不过就不出包"是靠步骤顺序天然保证的，不需要额外写判断。
  # ───────────────────────────────────────────────────────────
  build:
    name: 测试并构建 APK
    # GitHub 免费提供的 Ubuntu 虚拟机，已预装 JDK / Android SDK / Gradle 所需环境
    runs-on: ubuntu-latest
    # 防止卡死时白烧 6 小时（默认上限）
    timeout-minutes: 30

    env:
      # 这 4 个值来自仓库 Settings → Secrets and variables → Actions。
      # 没配置时它们是空字符串，下面的"解码 keystore"步骤会自动跳过，
      # build.gradle.kts 随即回退成 debug 签名 —— 本地开发不受影响。
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
      # ① 把这次提交的代码下载到虚拟机上（不写这一步，机器上是空的）
      - name: Checkout
        uses: actions/checkout@v4

      # ② 装 JDK 17：AGP 8.9.3 + Gradle 8.13 的受支持组合。
      #    不装的话用的是 runner 默认 JDK，版本会飘。
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ③ Gradle 官方动作：缓存 ~/.gradle，第二次运行能省几分钟
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ④ 把 Secrets 里的 base64 keystore 还原成文件。
      #    注意：secrets 上下文不能直接用在 step 的 if 里，
      #    所以先经 job 级 env 中转，这里判断 env 是否为空。
      - name: Decode release keystore
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          # 通过 $GITHUB_ENV 把路径传给后面的步骤（Gradle 从这里读）
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "已解码 keystore：$RUNNER_TEMP/release.jks"

      # ⑤ 质量门：单元测试。失败 → 这个 step 红 → job 红 →
      #    下面的构建和上传都不会执行，所以不会产出任何 APK。
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # ⑥ 出包：debug 用于日常安装，release 用你的正式 keystore 签名
      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      # ⑦ 把两个 APK 的签名指纹打到日志里。
      #    这是"release 包真的用了正式签名"的证据，不用下载就能核对。
      - name: Show APK signatures
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)
          echo "使用 $APKSIGNER"
          for apk in app/build/outputs/apk/*/*.apk; do
            echo "──────── $apk"
            "$APKSIGNER" verify --print-certs "$apk"
          done

      # ⑧ 上传产物：跑完之后在运行页面底部可以下载
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: gcap-client-apk
          path: app/build/outputs/apk/**/*.apk
          # 一个 APK 都没找到就直接报错，避免"绿色但没产物"的假成功
          if-no-files-found: error
          retention-days: 14
